name: My Scheduled Job

on:
  schedule:
    - cron: '05 0,4,8,12 * * *'
  workflow_dispatch:  # 允许你手动点击按钮测试[citation:12][citation:15]

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Verify JAR exists
        run: ls rocom
      - name: Run
        run: java -jar rocom/target/rocom-1.0-SNAPSHOT.jar
